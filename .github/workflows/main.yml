name: Build DotFront APK with p4a (NDK 25b)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK 25b
        run: |
          # Download and install Android SDK command line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

          # Accept licenses and install SDK platform and NDK
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "ndk;25.1.8937393"

          # Set environment variables for subsequent steps
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install p4a and build tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 python-for-android

      - name: Verify NDK version
        run: |
          echo "NDK root: $ANDROID_NDK_ROOT"
          ls -l $ANDROID_NDK_ROOT

      - name: Build APK with p4a
        run: |
          p4a apk \
            --private . \
            --package com.yourname.dotfront \
            --name "DotFront" \
            --version 0.1 \
            --bootstrap sdl2 \
            --requirements python3,pygame-ce,sdl2_ttf,freetype \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --android-api 34 \
            --ndk-api 21 \
            --permission INTERNET \
            --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          path: bin/*.apk
