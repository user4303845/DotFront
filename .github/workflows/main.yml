name: Build APK (Buildozer-Free)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Build Tools
        run: |
          python3 -m pip install --upgrade pip
          # We install Cython and p4a directly
          pip install cython==0.29.33 python-for-android

      - name: Build APK with p4a
        env:
          # Use the pre-installed SDK paths on GitHub runners
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          p4a apk --sdk-dir $ANDROID_HOME \
                  --ndk-dir $ANDROID_NDK_LATEST_HOME \
                  --dist_name dotfront_dist \
                  --package com.yourname.dotfront \
                  --name "DotFront" \
                  --version 0.1 \
                  --bootstrap sdl2 \
                  --requirements python3,kivy,pygame-ce \
                  --arch arm64-v8a \
                  --android-api 34 \
                  --ndk-api 21 \
                  --color always \
                  --storage-dir ./p4a_build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          # p4a creates the APK in the current directory
          path: "*.apk"
