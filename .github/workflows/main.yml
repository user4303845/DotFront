name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the exact repository name found on the Marketplace
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # 'stable' ensures we don't use buggy beta features
          buildozer_version: stable
          command: buildozer android debug --accept-sdk-license
          # We tell it specifically to look in the root folder
          workdir: .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          # The action saves the APK in a predictable place
          path: ${{ steps.buildozer.outputs.filename }}
