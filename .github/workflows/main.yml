name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer (Fixed Syntax)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e "BUILDOZER_ALLOW_KIVY_LICENSE_ACCEPTANCE=1" \
            kivy/buildozer:latest \
            android debug --accept-sdk-license

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          path: bin/*.apk
