name: Build DotFront APK (Forced NDK 25b)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK 25b
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          NDK_CUSTOM_DIR=$HOME/android-ndk-r25b
          cp -r $ANDROID_SDK_ROOT/ndk/25.1.8937393 $NDK_CUSTOM_DIR
          echo "NDK_CUSTOM_DIR=$NDK_CUSTOM_DIR" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install p4a and build tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 python-for-android

      - name: Unset conflicting environment variables
        run: |
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT

      - name: Build APK with p4a (explicit NDK)
        run: |
          p4a apk \
            --private . \
            --package com.yourname.dotfront \
            --name "DotFront" \
            --version 0.1 \
            --bootstrap sdl2 \
            --requirements python3,pygame-ce \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --android-api 34 \
            --ndk-api 21 \
            --sdk-dir $ANDROID_SDK_ROOT \
            --ndk-dir $NDK_CUSTOM_DIR \
            --permission INTERNET \
            --debug \
            --dist-name dotfront_dist

      - name: Locate APK
        run: |
          # Try to find the APK in common locations
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ~/.local/share/python-for-android/dists -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/DotFront.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          path: artifacts/DotFront.apk
