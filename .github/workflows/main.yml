name: Build DotFront APK with p4a (sdl2 bootstrap)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK with NDK 25b
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.1.8937393'   # NDK r25b (recommended for p4a)

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install p4a and build tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 python-for-android

      - name: Build APK with p4a
        env:
          ANDROID_SDK_ROOT: $ANDROID_HOME
          ANDROID_NDK_ROOT: $ANDROID_NDK_HOME
        run: |
          p4a apk \
            --private . \
            --package com.yourname.dotfront \
            --name "DotFront" \
            --version 0.1 \
            --bootstrap sdl2 \
            --requirements python3,pygame-ce,sdl2_ttf,freetype \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --android-api 34 \
            --ndk-api 21 \
            --permission INTERNET \
            --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          path: bin/*.apk
