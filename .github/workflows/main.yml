name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buildozer Action
        uses: artem-serebriakov/buildozer-action@v1
        with:
          buildozer_version: master
          python_version: 3.10
          command: buildozer android debug --accept-sdk-license
          buildozer_config: buildozer.spec

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          path: bin/*.apk
