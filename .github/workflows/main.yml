name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        # Using the official Kivy-maintained action to avoid permission bugs
        uses: kivy/buildozer-action@master
        with:
          command: buildozer android debug --accept-sdk-license
          buildozer_version: stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DotFront-APK
          # The official action puts the APK in the 'bin/' folder
          path: bin/*.apk
